<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC Flashcards System</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #0ea5e9;
            --bg: #f8fafc;
            --card-front: #ffffff;
            --card-back: #eff6ff;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 5px;
            color: var(--primary);
        }

        .selector-container {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select {
            padding: 10px 15px;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
            background-color: white;
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .progress-container {
            width: 100%;
            max-width: 500px;
            background-color: #e2e8f0;
            border-radius: 10px;
            height: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .counter {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        .flashcard-wrapper {
            width: 100%;
            max-width: 500px;
            height: 320px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-front {
            background-color: var(--card-front);
            border: 2px solid #e2e8f0;
        }

        .card-front .word {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .card-front .pos {
            font-style: italic;
            color: var(--text-sub);
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .card-front .hint {
            font-size: 1rem;
            color: #475569;
            background: #f1f5f9;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 90%;
        }

        .card-back {
            background-color: var(--card-back);
            transform: rotateY(180deg);
            border: 2px solid #bfdbfe;
            justify-content: space-between;
            align-items: flex-start;
            text-align: left;
        }

        .card-back .meaning {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 12px;
            width: 100%;
            border-bottom: 2px dashed #bfdbfe;
            padding-bottom: 8px;
        }

        .card-back .details {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
            width: 100%;
        }

        .card-back .synonyms {
            margin-bottom: 10px;
            color: #0369a1;
        }

        .card-back .example-en {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-back .example-vi {
            color: #475569;
            font-style: italic;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button.btn-shuffle {
            background-color: var(--secondary);
            box-shadow: 0 4px 6px -1px rgba(14, 165, 233, 0.2);
        }

        button.btn-shuffle:hover {
            background-color: #0284c7;
        }

        button:disabled {
            background-color: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .tip {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .pron {
            color: green;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>TOEIC Flashcards</h1>
    
    <div class="selector-container">
        <label for="topicSelect"><strong>Choose Lesson:</strong></label>
        <select id="topicSelect" onchange="changeTopic()">
            <option value="contracts">Lesson 1: Contracts (Hợp đồng)</option>
            <option value="marketing">Lesson 2: Marketing (Tiếp thị)</option>
            <option value="warranties">Lesson 3: Warranties (Sự bảo hành)</option>
            <option value="business_planning">Lesson 4: Business_planning</option>
            <option value="conference">Lesson 5: Conference (Hội nghị)</option>
            <option value="computer_and_internets">Lesson 6: Computer and Internets</option>
            <option value="office_technology">Lesson 7: Office technology</option>
            
        </select>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="counter" id="counter">Card 1 of 11</div>

    <div class="flashcard-wrapper" onclick="flipCard()">
        <div class="flashcard" id="flashcard">
            <div class="card-face card-front">
                <div class="word" id="f-word">-</div>
                <div class="pos" id="f-pos">-</div>
                <div class="pron" id="f-pron">-</div>
                <div class="hint" id="f-hint">-</div>
            </div>
            <div class="card-face card-back">
                <div class="meaning" id="b-meaning">-</div>
                <div class="details">
                    <div class="synonyms"><strong>Synonyms:</strong> <span id="b-syn">-</span></div>
                    <div class="example-en"><strong>Example:</strong> <span id="b-ex-en">-</span></div>
                    <div class="example-vi"><strong>Dịch:</strong> <span id="b-ex-vi">-</span></div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="prevBtn" onclick="prevCard()">Back</button>
        <button class="btn-shuffle" id="shuffleBtn" onclick="shuffleCards()">🔀 Shuffle</button>
        <button id="nextBtn" onclick="nextCard()">Next</button>
    </div>

    <div class="tip">💡 Click on the card to flip and see the definition!</div>

    <script>
        const dataset = {

                { word: "cancellation", pos: "(n)", pronunciation: "/ˌkænsəˈleɪʃn/", hint: "The ______ of her flight caused...", meaning: "Sự hủy bỏ", syn: "annulment, stopping", exEn: "The cancellation of her flight caused her problems for the rest of the week.", exVi: "Việc hủy chuyến bay đã gây ra nhiều rắc rối cho cô ấy trong suốt thời gian còn lại của tuần." },
                { word: "determine", pos: "(v)", pronunciation: "/dɪˈtɜːrmɪn/", hint: "I was unable to ______ if our company...", meaning: "Xác định, tìm ra", syn: "find out, influence", exEn: "After reading the contract, I was still unable to determine if our company was liable for back wages.", exVi: "Sau khi đọc hợp đồng, tôi vẫn không thể xác định liệu công ty chúng tôi có phải chịu trách nhiệm trả số tiền lương còn nợ hay không." },

        let currentActiveCards = [];
        let currentIndex = 0;
        const cardElement = document.getElementById('flashcard');

        function loadTopic(topicName) {
            currentActiveCards = [...dataset[topicName]];
            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            const data = currentActiveCards[currentIndex];
            
            document.getElementById('f-word').innerText = data.word;
            document.getElementById('f-pos').innerText = data.pos;
            document.getElementById('f-pron').innerText = data.pronunciation;
            document.getElementById('f-hint').innerText = "💡 Hint: " + data.hint;
            
            document.getElementById('b-meaning').innerText = data.meaning;
            document.getElementById('b-syn').innerText = data.syn;
            document.getElementById('b-ex-en').innerText = data.exEn;
            document.getElementById('b-ex-vi').innerText = data.exVi;

            document.getElementById('counter').innerText = `Card ${currentIndex + 1} of ${currentActiveCards.length}`;
            const progressPercent = ((currentIndex + 1) / currentActiveCards.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === currentActiveCards.length - 1;
        }

        function flipCard() {
            cardElement.classList.toggle('is-flipped');
        }

        document.getElementById('topicSelect').addEventListener('change', function() {
            resetFlipState(() => {
                loadTopic(this.value);
            });
        });

        function shuffleCards() {
            resetFlipState(() => {
                for (let i = currentActiveCards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [currentActiveCards[i], currentActiveCards[j]] = [currentActiveCards[j], currentActiveCards[i]];
                }
                currentIndex = 0;
                renderCard();
            });
        }

        function nextCard() {
            if (currentIndex < currentActiveCards.length - 1) {
                resetFlipState(() => {
                    currentIndex++;
                    renderCard();
                });
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                resetFlipState(() => {
                    currentIndex--;
                    renderCard();
                });
            }
        }

        function resetFlipState(callback) {
            if (cardElement.classList.contains('is-flipped')) {
                cardElement.classList.remove('is-flipped');
                setTimeout(callback, 250);
            } else {
                callback();
            }
        }

        loadTopic('contracts');
