<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC Flashcards System</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #0ea5e9;
            --bg: #f8fafc;
            --card-front: #ffffff;
            --card-back: #eff6ff;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 5px;
            color: var(--primary);
        }

        .selector-container {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .topic-tabs {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 900px;
            margin: 12px 0 24px;
            padding: 4px 2px 10px;
            overflow-x: auto;
            border-bottom: 1px solid #cbd5e1;
            scrollbar-width: thin;
        }

        .parent-tabs {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: 0;
        }

        .topic-tab {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border-radius: 6px;
            background: transparent;
            color: var(--text-sub);
            box-shadow: none;
            white-space: nowrap;
        }

        .topic-tab:hover,
        .topic-tab[aria-pressed="true"] {
            background: #e0f2fe;
            color: #075985;
            transform: none;
            box-shadow: none;
        }

        .parent-tabs .topic-tab[aria-pressed="true"] {
            background: var(--primary);
            color: white;
        }

        .tab-count {
            color: inherit;
            font-size: 0.8rem;
            opacity: 0.75;
        }

        select {
            padding: 10px 15px;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
            background-color: white;
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .progress-container {
            width: 100%;
            max-width: 500px;
            background-color: #e2e8f0;
            border-radius: 10px;
            height: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .counter {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        .flashcard-wrapper {
            width: 100%;
            max-width: 500px;
            height: 320px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-front {
            background-color: var(--card-front);
            border: 2px solid #e2e8f0;
        }

        .card-front .word {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0;
        }

        .word-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            max-width: 100%;
            margin-bottom: 10px;
        }

        .speak-btn {
            flex: 0 0 auto;
            padding: 7px 10px;
            border-radius: 6px;
            box-shadow: none;
            font-size: 0.9rem;
        }

        .card-front .pos {
            font-style: italic;
            color: var(--text-sub);
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .card-front .hint {
            font-size: 1rem;
            color: #475569;
            background: #f1f5f9;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 90%;
        }

        .card-back {
            background-color: var(--card-back);
            transform: rotateY(180deg);
            border: 2px solid #bfdbfe;
            justify-content: space-between;
            align-items: flex-start;
            text-align: left;
        }

        .card-back .meaning {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 12px;
            width: 100%;
            border-bottom: 2px dashed #bfdbfe;
            padding-bottom: 8px;
        }

        .card-back .details {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
            width: 100%;
        }

        .card-back .synonyms {
            margin-bottom: 10px;
            color: #0369a1;
        }

        .card-back .example-en {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-back .example-vi {
            color: #475569;
            font-style: italic;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button.btn-shuffle {
            background-color: var(--secondary);
            box-shadow: 0 4px 6px -1px rgba(14, 165, 233, 0.2);
        }

        button.btn-shuffle:hover {
            background-color: #0284c7;
        }

        button:disabled {
            background-color: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .tip {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .pron {
            color: green;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>TOEIC Flashcards</h1>
    
    <nav id="groupTabs" class="topic-tabs parent-tabs" aria-label="Vocabulary collections"></nav>
    <nav id="topicTabs" class="topic-tabs" aria-label="Topics"></nav>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="counter" id="counter">Card 1 of 11</div>

    <div class="flashcard-wrapper" onclick="flipCard()">
        <div class="flashcard" id="flashcard">
            <div class="card-face card-front">
                <div class="word-row">
                    <div class="word" id="f-word">-</div>
                    <button class="speak-btn" id="speakBtn" onclick="speakWord(event)" aria-label="Speak vocabulary">🔊</button>
                </div>
                <div class="pos" id="f-pos">-</div>
                <div class="pron" id="f-pron">-</div>
                <div class="hint" id="f-hint">-</div>
            </div>
            <div class="card-face card-back">
                <div class="meaning" id="b-meaning">-</div>
                <div class="details">
                    <div class="synonyms"><strong>Synonyms:</strong> <span id="b-syn">-</span></div>
                    <div class="example-en"><strong>Example:</strong> <span id="b-ex-en">-</span></div>
                    <div class="example-vi"><strong>Dịch:</strong> <span id="b-ex-vi">-</span></div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="prevBtn" onclick="prevCard()">Back</button>
        <button class="btn-shuffle" id="shuffleBtn" onclick="shuffleCards()">🔀 Shuffle</button>
        <button id="nextBtn" onclick="nextCard()">Next</button>
    </div>

    <div class="tip">💡 Click on the card to flip and see the definition!</div>

    <script>
        let groups = [];
        let currentGroupIndex = 0;
        let currentActiveCards = [];
        let currentIndex = 0;
        let currentTopicId = '';
        const cardElement = document.getElementById('flashcard');
        const groupTabsElement = document.getElementById('groupTabs');
        const topicTabsElement = document.getElementById('topicTabs');

        function getCurrentTopic() {
            const currentGroup = groups[currentGroupIndex];
            return currentGroup ? currentGroup.topics.find(topic => topic.id === currentTopicId) : null;
        }

        function renderGroupTabs() {
            groupTabsElement.replaceChildren();
            groups.forEach((group, index) => {
                const tab = document.createElement('button');
                tab.className = 'topic-tab';
                tab.type = 'button';
                tab.setAttribute('aria-pressed', String(index === currentGroupIndex));
                const label = document.createElement('span');
                label.textContent = group.label;
                const count = document.createElement('span');
                count.className = 'tab-count';
                count.textContent = group.topics.reduce((total, topic) => total + topic.cards.length, 0);
                tab.append(label, count);
                tab.addEventListener('click', () => changeGroup(index));
                groupTabsElement.appendChild(tab);
            });
        }

        function renderTopicTabs() {
            topicTabsElement.replaceChildren();
            const currentGroup = groups[currentGroupIndex];
            (currentGroup ? currentGroup.topics : []).forEach((topic, index) => {
                const tab = document.createElement('button');
                tab.className = 'topic-tab';
                tab.type = 'button';
                tab.id = `topic-tab-${index}`;
                tab.setAttribute('aria-pressed', String(topic.id === currentTopicId));
                const label = document.createElement('span');
                label.textContent = topic.label;
                const count = document.createElement('span');
                count.className = 'tab-count';
                count.textContent = topic.cards.length;
                tab.append(label, count);
                tab.addEventListener('click', () => changeTopic(topic.id));
                topicTabsElement.appendChild(tab);
            });
        }

        function changeGroup(groupIndex) {
            if (!groups[groupIndex]) return;
            resetFlipState(() => {
                currentGroupIndex = groupIndex;
                const firstTopic = groups[groupIndex].topics[0];
                currentTopicId = firstTopic ? firstTopic.id : '';
                currentActiveCards = firstTopic ? [...firstTopic.cards] : [];
                currentIndex = 0;
                renderGroupTabs();
                renderTopicTabs();
                renderCard();
            });
        }

        function changeTopic(topicId) {
            const selectedTopic = groups[currentGroupIndex].topics.find(topic => topic.id === topicId);
            if (!selectedTopic) return;
            resetFlipState(() => {
                currentTopicId = topicId;
                currentActiveCards = [...selectedTopic.cards];
                currentIndex = 0;
                renderTopicTabs();
                renderCard();
            });
        }

        function renderCard() {
            const hasCards = currentActiveCards.length > 0;
            const data = currentActiveCards[currentIndex];

            const selectedTopic = getCurrentTopic();
            document.getElementById('f-word').textContent = data ? data.word : selectedTopic ? selectedTopic.label : 'No topics';
            document.getElementById('f-pos').textContent = data ? data.pos : '';
            document.getElementById('f-pron').textContent = data ? data.pronunciation : '';
            document.getElementById('f-hint').textContent = data ? `Hint: ${data.hint}` : 'Add entries to this topic in vocabulary.json.';
            document.getElementById('b-meaning').textContent = data ? data.meaning : 'No vocabulary yet';
            document.getElementById('b-syn').textContent = data ? data.syn : '';
            document.getElementById('b-ex-en').textContent = data ? data.exEn : '';
            document.getElementById('b-ex-vi').textContent = data ? data.exVi : '';

            document.getElementById('counter').textContent = hasCards
                ? `Card ${currentIndex + 1} of ${currentActiveCards.length}`
                : '0 words';
            document.getElementById('progressBar').style.width = hasCards
                ? `${((currentIndex + 1) / currentActiveCards.length) * 100}%`
                : '0%';
            document.getElementById('prevBtn').disabled = !hasCards || currentIndex === 0;
            document.getElementById('nextBtn').disabled = !hasCards || currentIndex === currentActiveCards.length - 1;
            document.getElementById('shuffleBtn').disabled = !hasCards;
            document.getElementById('speakBtn').disabled = !hasCards || !('speechSynthesis' in window);
        }

        function flipCard() {
            if (currentActiveCards.length) cardElement.classList.toggle('is-flipped');
        }

        function speakWord(event) {
            event.stopPropagation();
            if (!currentActiveCards.length || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(currentActiveCards[currentIndex].word);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        function shuffleCards() {
            resetFlipState(() => {
                for (let index = currentActiveCards.length - 1; index > 0; index--) {
                    const randomIndex = Math.floor(Math.random() * (index + 1));
                    [currentActiveCards[index], currentActiveCards[randomIndex]] = [currentActiveCards[randomIndex], currentActiveCards[index]];
                }
                currentIndex = 0;
                renderCard();
            });
        }

        function nextCard() {
            if (currentIndex < currentActiveCards.length - 1) {
                resetFlipState(() => {
                    currentIndex++;
                    renderCard();
                });
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                resetFlipState(() => {
                    currentIndex--;
                    renderCard();
                });
            }
        }

        function resetFlipState(callback) {
            if (cardElement.classList.contains('is-flipped')) {
                cardElement.classList.remove('is-flipped');
                setTimeout(callback, 250);
            } else {
                callback();
            }
        }

        fetch('./vocabulary.json')
            .then(response => {
                if (!response.ok) throw new Error('Vocabulary data could not be loaded.');
                return response.json();
            })
            .then(vocabulary => {
                groups = Array.isArray(vocabulary.groups) ? vocabulary.groups : [];
                currentGroupIndex = 0;
                renderGroupTabs();
                const firstGroup = groups[currentGroupIndex];
                const firstTopic = firstGroup && firstGroup.topics[0];
                currentTopicId = firstTopic ? firstTopic.id : '';
                currentActiveCards = firstTopic ? [...firstTopic.cards] : [];
                renderTopicTabs();
                if (firstGroup) {
                    renderCard();
                }
            })
            .catch(() => {
                document.getElementById('counter').textContent = 'Could not load vocabulary.json. Open this page through a local web server.';
            });
    </script>
</body>
</html>
